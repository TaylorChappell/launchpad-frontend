name: Frontend checks

on:
  pull_request:
  push:
    branches: [main, staging]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Check Fee Redirect on desktop and mobile
        run: npx playwright test e2e/fee-redirect.spec.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aqua-redirect-previews
          path: |
            test-results/**/*compact-redirect*.png
            test-results/**/error-context.md
          if-no-files-found: ignore
      - name: Check themes on desktop and mobile
        run: npx playwright test e2e/theme.spec.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aqua-theme-previews
          path: |
            test-results/**/*compact-dark*.png
            test-results/**/error-context.md
          if-no-files-found: ignore
      - name: Check market candles and auto rewards on desktop and mobile
        run: npx playwright test e2e/candles.spec.ts e2e/market-cards.spec.ts e2e/auto-rewards.spec.ts e2e/launchpad.spec.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candlestick-previews
          path: |
            test-results/**/*compact*.png
            test-results/**/error-context.md
          if-no-files-found: ignore
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: test-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compact-ui-previews
          path: test-results/**/*compact*.png
          if-no-files-found: ignore
